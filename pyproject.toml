[tool.poetry]
name = "high-reliability-customer-profile-api"
version = "0.1.0"
description = "High Reliability Customer Profile API"
authors = ["Auto Generated <dev@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = {extras=["standard"], version="^0.29.0"}
sqlalchemy = "^2.0.29"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.1"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
redis = "^5.0.3"
celery = "^5.3.6"
pyjwt = "^2.8.0"
passlib = "^1.7.4"
structlog = "^24.1.0"
prometheus-client = "^0.20.0"
aiohttp = "^3.9.3"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
pytest-cov = "^4.1.0"
black = "^24.4.2"
isort = "^5.13.2"
requests = "^2.32.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
